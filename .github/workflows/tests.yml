name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: homekit/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools -p 'test_lamp_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci && npm test
        working-directory: homekit
